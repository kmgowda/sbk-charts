##

[application]
name = sbk-charts
distribution_name = sbk-charts
module = src.main.sbk_charts
entry_point = src.main.sbk_charts:sbk_charts
description = Charts for SBK performance results and AI-based analysis
url = https://github.com/kmgowda/sbk-charts
license = Apache License Version 2.0
author = KMG
author_email = keshava.gowda@gmail.com
version_file = src/version/sbk_version.py
runtime_requirements = requirements.txt

[package_data]
src.main = banner.txt
src.images = sbk-logo.png

[runtime]
minimum_python = 3.10
managed_python = 3.12.10
default_conda_environment = sbk-charts
runtime_state_file = .sbk-charts-runtime
runtime_state_schema = 1
virtual_environment_names = venv-sbk-charts, .venv, sbk-charts-venv
managed_runtime_directory = .sbk-runtime
lock_directory = requirements-lock
bootstrap_lock_timeout_seconds = 300
unix_python_commands = python3.12, python3.11, python3.10, python3, python
windows_python_launchers = py, python, python3

[bootstrap]
manager = uv
manager_version = 0.12.5
download_base_url = https://github.com/astral-sh/uv/releases/download
connect_timeout_seconds = 15
download_timeout_seconds = 300
download_retries = 3
linux-amd64-archive = uv-x86_64-unknown-linux-gnu.tar.gz
linux-amd64-sha256 = 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
linux-arm64-archive = uv-aarch64-unknown-linux-gnu.tar.gz
linux-arm64-sha256 = 9bf43b4d1a07665bf64d4c4e710930b382321a785e0eb10aac07f46471f86a31
macos-arm64-archive = uv-aarch64-apple-darwin.tar.gz
macos-arm64-sha256 = 5bb0e5fe008a773c3dbcb97ff79cd89e1241464fe9d2f986d52ad8f1b037bd62
macos-amd64-archive = uv-x86_64-apple-darwin.tar.gz
macos-amd64-sha256 = b3b2137477cf96c9686ebfb71524614cec780c673fd73e59bce099aef02e70e8
windows-amd64-archive = uv-x86_64-pc-windows-msvc.zip
windows-amd64-sha256 = 4c4d49d8738847d9b71ba319e49a5688c93eac0fe6204b1df24e98528dddf39a
windows-arm64-archive = uv-aarch64-pc-windows-msvc.zip
windows-arm64-sha256 = 724279317fee6e5fa8ad1908e4eba2bbe764ef1ece5b3f4597927b62b1fe562a

[ai.requirements]
anthropic = requirements-ai/anthropic.txt
gemini = requirements-ai/gemini.txt
huggingface = requirements-ai/huggingface.txt
lmstudio = requirements-ai/lmstudio.txt
ollama = requirements-ai/ollama.txt
pytorchllm = requirements-ai/pytorchllm.txt

[portable]
targets = linux-amd64, macos-arm64, windows-amd64
manifest_name = manifest.json
checksum_suffix = .sha256
hash_algorithm = sha256
build_python = 3.12
runtime_state_schema = 1
runtime_directory = sbk-charts/portable
bootstrap_lock_timeout_seconds = 300
bundle_paths = LICENSE, README.md, sbk-charts.ini, docs, requirements.txt, requirements-bootstrap.txt, requirements-ai, requirements-lock, scripts/windows_self_extractor.cs, src/custom_ai/README.md, src/custom_ai/anthropic/README.md, src/custom_ai/gemini/README.md, src/custom_ai/hugging_face/README.md, src/custom_ai/lm_studio/README.md, src/custom_ai/no_ai/README.md, src/custom_ai/ollama/README.md, src/custom_ai/pytorch_llm/README.md
entry_script = scripts/sbk_charts_portable_entry.py
collect_submodules = src.custom_ai

[portable.platforms]
darwin = macos
linux = linux
win32 = windows

[portable.architectures]
arm64 = arm64
aarch64 = arm64
amd64 = amd64
x86_64 = amd64
x64 = amd64

[portable.archive_formats]
linux-amd64 = tar.gz
macos-arm64 = tar.gz
windows-amd64 = zip

[portable.self_extracting_extensions]
linux-amd64 = run
macos-arm64 = run
windows-amd64 = exe

[portable.runners]
linux-amd64 = ubuntu-24.04
macos-arm64 = macos-15
windows-amd64 = windows-2022

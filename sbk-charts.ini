[application]
name = sbk-charts
distribution_name = sbk-charts
module = src.main.sbk_charts
entry_point = src.main.sbk_charts:sbk_charts
description = Charts for SBK performance results and AI-based analysis
url = https://github.com/kmgowda/sbk-charts
license = Apache License Version 2.0
author = KMG
author_email = keshava.gowda@gmail.com
version_file = src/version/sbk_version.py
runtime_requirements = requirements.txt

[package_data]
src.main = banner.txt
src.images = sbk-logo.png

[runtime]
minimum_python = 3.10
default_conda_environment = sbk-charts
runtime_state_file = .sbk-charts-runtime
virtual_environment_names = venv-sbk-charts, .venv, sbk-charts-venv
unix_python_commands = python3.14, python3.13, python3.12, python3.11, python3.10, python3, python
windows_python_launchers = py, python, python3

[portable]
targets = linux-amd64, macos-arm64, windows-amd64
manifest_name = manifest.json
checksum_suffix = .sha256
hash_algorithm = sha256
build_python = 3.12
bundle_paths = LICENSE, README.md, sbk-charts.ini, docs
entry_script = scripts/sbk_charts_portable_entry.py
collect_submodules = src.custom_ai

[portable.platforms]
darwin = macos
linux = linux
win32 = windows

[portable.architectures]
arm64 = arm64
aarch64 = arm64
amd64 = amd64
x86_64 = amd64
x64 = amd64

[portable.archive_formats]
linux-amd64 = tar.gz
macos-arm64 = tar.gz
windows-amd64 = zip

[portable.runners]
linux-amd64 = ubuntu-24.04
macos-arm64 = macos-15
windows-amd64 = windows-2022

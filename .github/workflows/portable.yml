##

name: Portable releases

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - id: matrix
      name: Load portable target policy
      shell: bash
      run: echo "value=$(python3 scripts/project_policy.py --github-matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: policy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-bootstrap.txt
          requirements-ai/*.txt
          requirements-portable.txt
    - name: Install CPU-only PyTorch for Linux portability
      if: runner.os == 'Linux'
      run: python -m pip install "torch==2.9.1" --index-url https://download.pytorch.org/whl/cpu
    - name: Install application and portable build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[all-ai]" -r requirements-portable.txt
    - name: Test portable build support
      run: python -m unittest discover -s tests -p "test_portable.py"
    - name: Build self-extracting portable application
      run: python scripts/build_portable.py
    - name: Verify self-extraction, saved reuse, and workbook on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        artifact=$(find dist/portable -type f -name '*.run' -print -quit)
        chmod +x "$artifact"
        export SBK_CHARTS_PORTABLE_ROOT="$RUNNER_TEMP/sbk-charts-portable-test"
        "$artifact" -h > first-help.txt &
        first_pid=$!
        "$artifact" -h > concurrent-help.txt &
        concurrent_pid=$!
        wait "$first_pid"
        wait "$concurrent_pid"
        test "$(grep -h -c "Selection source: self-extract-created" first-help.txt concurrent-help.txt | awk '{total += $1} END {print total}')" -eq 1
        test "$(grep -h -c "Saved environment reused: yes" first-help.txt concurrent-help.txt | awk '{total += $1} END {print total}')" -eq 1
        "$artifact" -h > second-help.txt
        grep -q "Selection source: self-extract-cache" second-help.txt
        grep -q "Saved environment reused: yes" second-help.txt
        "$artifact" -i "$GITHUB_WORKSPACE/samples/charts/sbk-file-read.csv" \
          -o "$RUNNER_TEMP/self-extract-report.xlsx" noai
        test -s "$RUNNER_TEMP/self-extract-report.xlsx"
    - name: Verify self-extraction, saved reuse, and workbook on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $Artifact = Get-ChildItem dist/portable/*.exe | Select-Object -First 1
        $env:SBK_CHARTS_PORTABLE_ROOT = Join-Path $env:RUNNER_TEMP "sbk-charts-portable-test"
        $ReadyDirectory = Join-Path $env:SBK_CHARTS_PORTABLE_ROOT "concurrency-ready"
        New-Item -ItemType Directory -Force -Path $ReadyDirectory | Out-Null
        $ConcurrentRun = {
          param($Path, $Root, $ReadyDirectory, $ReadyName)
          $env:SBK_CHARTS_PORTABLE_ROOT = $Root
          Set-Content -LiteralPath (Join-Path $ReadyDirectory "$ReadyName.ready") `
            -Value $PID -Encoding ASCII
          $BarrierDeadline = (Get-Date).AddSeconds(30)
          while (@(Get-ChildItem -LiteralPath $ReadyDirectory -Filter "*.ready" -File).Count -lt 2) {
            if ((Get-Date) -ge $BarrierDeadline) {
              throw "Timed out waiting for concurrent extraction start barrier"
            }
            Start-Sleep -Milliseconds 50
          }
          & $Path -h
          if ($LASTEXITCODE -ne 0) { throw "Self-extracting application failed" }
        }
        $First = Start-Job -ScriptBlock $ConcurrentRun -ArgumentList `
          $Artifact.FullName, $env:SBK_CHARTS_PORTABLE_ROOT, $ReadyDirectory, "first"
        $Concurrent = Start-Job -ScriptBlock $ConcurrentRun -ArgumentList `
          $Artifact.FullName, $env:SBK_CHARTS_PORTABLE_ROOT, $ReadyDirectory, "concurrent"
        $Jobs = @($First, $Concurrent)
        $Completed = @(Wait-Job -Job $Jobs -Timeout 600)
        if ($Completed.Count -ne $Jobs.Count) {
          $Jobs | Stop-Job
          throw "Concurrent extraction did not finish within 600 seconds"
        }
        if ($First.State -ne "Completed" -or $Concurrent.State -ne "Completed") {
          throw "Concurrent extraction failed"
        }
        Receive-Job $First | Set-Content first-help.txt
        Receive-Job $Concurrent | Set-Content concurrent-help.txt
        $ConcurrentOutput = Get-Content first-help.txt, concurrent-help.txt
        if (($ConcurrentOutput | Select-String "Selection source: self-extract-created").Count -ne 1) { throw "Exactly one process must create the payload" }
        if (($ConcurrentOutput | Select-String "Saved environment reused: yes").Count -ne 1) { throw "Exactly one concurrent process must reuse the payload" }
        & $Artifact.FullName -h | Tee-Object -FilePath second-help.txt
        if (-not (Select-String -Quiet -Path second-help.txt -Pattern "Selection source: self-extract-cache")) { throw "Saved extraction was not selected" }
        if (-not (Select-String -Quiet -Path second-help.txt -Pattern "Saved environment reused: yes")) { throw "Saved extraction reuse was not reported" }
        $Report = Join-Path $env:RUNNER_TEMP "self-extract-report.xlsx"
        & $Artifact.FullName -i "$env:GITHUB_WORKSPACE\samples\charts\sbk-file-read.csv" -o $Report noai
        if (-not (Test-Path -LiteralPath $Report -PathType Leaf)) { throw "Workbook was not created" }
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: portable-${{ matrix.target }}
        path: dist/portable/*
        if-no-files-found: error
    - name: Attach portable files to the GitHub release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" dist/portable/* --clobber

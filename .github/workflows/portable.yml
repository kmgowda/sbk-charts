##

name: Portable releases

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - id: matrix
      name: Load portable target policy
      shell: bash
      run: echo "value=$(python3 scripts/project_policy.py --github-matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: policy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-bootstrap.txt
          requirements-ai/*.txt
          requirements-portable.txt
    - name: Install CPU-only PyTorch for Linux portability
      if: runner.os == 'Linux'
      run: python -m pip install "torch==2.9.1" --index-url https://download.pytorch.org/whl/cpu
    - name: Install application and portable build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[all-ai]" -r requirements-portable.txt
    - name: Test portable build support
      run: python -m unittest discover -s tests -p "test_portable.py"
    - name: Build portable archive
      run: python scripts/build_portable.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: portable-${{ matrix.target }}
        path: dist/portable/*
        if-no-files-found: error
    - name: Attach portable files to the GitHub release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" dist/portable/* --clobber
